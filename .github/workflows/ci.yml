name: CI and release

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  IMAGE_NAME: cubesystems/deploy-utils

jobs:
  image:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set release image tag
        if: github.event_name == 'release'
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo 'Expected a version release tag such as 1.9 or v1.9' >&2
            exit 1
          fi
          printf 'image=%s:%s\n' "$IMAGE_NAME" "$version" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        if: github.event_name == 'release'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.release.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
